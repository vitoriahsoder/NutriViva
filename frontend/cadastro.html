<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | NutriViva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <a href="index.html" class="logo">NutriViva</a>
        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main class="pagina-login">
        <section class="login-imagem">
            <div>
                <span>COMECE SUA JORNADA</span>
                <h1>Uma rotina mais organizada começa <em>aqui.</em></h1>
                <p>Crie sua conta e tenha suas refeições em um só lugar.</p>
            </div>
        </section>

        <section class="login-formulario">
            <div class="login-card">
                <span>FAÇA PARTE DO NUTRIVIVA</span>
                <h2>Crie sua conta</h2>
                <p>Preencha seus dados para começar.</p>

                <form id="formCadastro">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" required minlength="6">

                    <button type="submit">Criar minha conta</button>

                    <p id="mensagemCadastro"></p>
                </form>

                <p class="link-cadastro">
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>
            </div>
        </section>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
